name: agent-auto-fix-temp

permissions:
  contents: write

on:
  push:
    branches:
      - agent/principle-enforcement-orchestrator

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/principle-enforcement-orchestrator

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76

      - name: Install packages
        env:
          npm_config_ignore_scripts: "true"
          CI: "true"
        run: make install_ci

      - name: Apply deterministic formatting
        run: bun biome check --write docs/schemas/approach-registry.schema.json

      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schemas/approach-registry.schema.json
          git commit -m "fix(agent): apply Biome formatting"
          git push origin HEAD:agent/principle-enforcement-orchestrator
